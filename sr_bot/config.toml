# 기본 설정. 주석을 지우고 값을 바꾸면 기본값을 덮어쓴다. 전체 항목은 sr_bot/config.py 참고.

market = "kr"        # kr | us
tf = "W"             # 신호를 판정할 프레임: D(일봉) | W(주봉) | M(월봉)
level_tfs = ["D", "W", "M", "Y"]   # 기준선을 찾을 프레임 (Y = 연봉 종가선)
history_years = 6

# 가격 계획 필터
min_net_rr = 1.5
min_target_gap = 0.01
max_stop_pct = 0.08

# 박스 돌파 후 철회 기준: "high"(박스 고점) | "close"(박스 종가) | "low"(박스 저점) 아래 종가 마감 시 철회
# 박스 안 매수는 고점·종가·저점 3분할이며, 철회선 아래 지점은 매수하지 않는다.
box_fail = "low"

# 계좌·리스크: account가 0이면 수량 계산 생략
account = 0
risk_per_trade = 0.01      # 1회 매매 최대 손실 = 계좌의 1%
max_position_pct = 0.20

top_n = 20
detail_n = 10

# 프레임별 판정 파라미터 덮어쓰기 예시
# [tf_params.W]
# high_vol_mult = 2.0
# retest_zone = 0.03

# 원/달러 환율 대체값 (실행 시 야후 KRW=X로 자동 갱신, 실패하면 이 값)
fx_usd_krw = 1350.0

# 스캔 대상(--universe)별 사건봉 절대 거래대금 하한 (원화, 실행 시 달러 환산)
[universe_min_krw]
sp500 = 500_000_000_000   # S&P 500: 5,000억 원 이상
ndx = 200_000_000_000     # 나스닥-100: 2,000억 원 이상

# 시장별 비용·유동성 덮어쓰기 예시
# [market_params.us]
# event_min_value_krw = 200_000_000_000   # 위 표에 없는 대상의 기본값
# [market_params.kr]
# min_turnover = 1_000_000_000
