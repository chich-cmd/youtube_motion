name: sr-bot backtest

on:
  workflow_dispatch:
    inputs:
      market:
        description: "kr | us"
        default: "us"
      tf:
        description: "D | W | M"
        default: "D"
      universe:
        description: "sp500 | ndx | 쉼표 구분 코드 (비우면 시장 전체)"
        default: "ndx"
      limit:
        description: "앞에서부터 N종목만 (0 = 전부)"
        default: "100"
      years:
        default: "10"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: sr_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sr_bot/requirements.txt
      - run: pip install -r requirements.txt
      - run: |
          u=""; [ -n "${{ inputs.universe }}" ] && u="--universe ${{ inputs.universe }}"
          python -m sr_bot backtest --market "${{ inputs.market }}" --tf "${{ inputs.tf }}" $u \
            --limit "${{ inputs.limit }}" --years "${{ inputs.years }}" | tee reports_summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sr-bot-backtest-${{ github.run_id }}
          path: |
            sr_bot/reports/
            sr_bot/reports_summary.txt
